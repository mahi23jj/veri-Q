# VeriQ reference integration for a Celery target application.
#
# DEVELOPMENT / TEST ONLY. Never point this at a production broker, database or
# payment provider, and never put real secrets in this file.
#
# Copy .env.example to .env and fill it in, then from this directory:
#   docker compose up --build
#
# Inspect which queues each worker consumes:
#   docker compose logs worker | grep -E "celery@|queues"
#   docker compose logs veriq-worker | grep -E "celery@|queues"

name: veriq-celery-target

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Small FastAPI front door that enqueues example tasks. It also initialises the
  # VeriQ SDK so tasks/workers are discovered before work is submitted.
  api:
    build:
      context: ../..
      dockerfile: examples/celery-target-app/Dockerfile
    command: ["uvicorn", "app.main:app", "--host=0.0.0.0", "--port=8100"]
    ports:
      - "${API_PORT:-8100}:8100"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_NORMAL_QUEUE: ${CELERY_NORMAL_QUEUE:-normal}
      VERIQ_QUEUE: ${VERIQ_QUEUE:-veriq.test}
      TARGET_DATABASE_URL: ${TARGET_DATABASE_URL}
      VERIQ_API_URL: ${VERIQ_API_URL}
      VERIQ_API_KEY: ${VERIQ_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # Normal traffic worker. It is instrumented too, so ordinary executions are
  # observed without an experiment.
  worker:
    build:
      context: ../..
      dockerfile: examples/celery-target-app/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.worker",
        "worker",
        "-Q",
        "${CELERY_NORMAL_QUEUE:-normal}",
        "--loglevel=INFO",
        "--concurrency=2"
      ]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_NORMAL_QUEUE: ${CELERY_NORMAL_QUEUE:-normal}
      VERIQ_QUEUE: ${VERIQ_QUEUE:-veriq.test}
      TARGET_DATABASE_URL: ${TARGET_DATABASE_URL}
      VERIQ_API_URL: ${VERIQ_API_URL}
      VERIQ_API_KEY: ${VERIQ_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  # Isolated VeriQ worker: same image, same task code, concurrency 1, and it
  # consumes only the VeriQ test queue. Kept for the later failure-injection
  # milestone; this milestone does not inject failures.
  veriq-worker:
    build:
      context: ../..
      dockerfile: examples/celery-target-app/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.worker",
        "worker",
        "-Q",
        "${VERIQ_QUEUE:-veriq.test}",
        "--loglevel=INFO",
        "--concurrency=1",
        "--hostname=veriq@%h"
      ]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_NORMAL_QUEUE: ${CELERY_NORMAL_QUEUE:-normal}
      VERIQ_QUEUE: ${VERIQ_QUEUE:-veriq.test}
      TARGET_DATABASE_URL: ${TARGET_DATABASE_URL}
      VERIQ_API_URL: ${VERIQ_API_URL}
      VERIQ_API_KEY: ${VERIQ_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
