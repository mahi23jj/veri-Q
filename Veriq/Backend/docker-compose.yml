# QueueProof — DEVELOPMENT ONLY compose setup (not for production).
#
# Copy .env.example to .env and fill in your own values first:
#   cp .env.example .env
#
# Start:
#   docker compose up --build
# Then run migrations explicitly (they are NOT run on backend startup):
#   docker compose exec backend alembic upgrade head
#
# Services: PostgreSQL :5432, backend :8000, frontend :5173

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-queueproof}
      POSTGRES_USER: ${POSTGRES_USER:-queueproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - queueproof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-queueproof}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-queueproof}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Backend container also runs scripts/wait_for_database.py before uvicorn.

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  queueproof_pgdata:
